name: EOD ClosePrice Job

on:
  schedule:
    - cron: '30 0 * * *' # UTC 00:30 = Asia/Taipei 08:30
  workflow_dispatch:

jobs:
  run-eod:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      DB_URL: ${{ secrets.DB_URL }}
      FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
      CLOSEPRICE_KEEP_LAST_N: ${{ secrets.CLOSEPRICE_KEEP_LAST_N }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check env
        run: |
          node -e "console.log('DB_URL exists:', !!process.env.DB_URL)"
          node -e "console.log('FINMIND_TOKEN exists:', !!process.env.FINMIND_TOKEN)"

      - name: Run EOD script
        run: node src/scripts/eodClosePrice.job.js
